name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version and Retag
        run: |
          # 1. Извлекаем версию и очищаем её от лишних символов (на всякий случай)
          RAW_VERSION=${GITHUB_REF_NAME#v}
          VERSION=$(echo "$RAW_VERSION" | tr -d '[:space:]')
          echo "Чистая версия: $VERSION"
          
          # 2. Путь к файлу
          FILE="custom_components/magnetic_storm/manifest.json"
          
          # Ищем "version": "любые символы кроме кавычек"
          sed -i "s|\"version\":\s*\"[^\"]*\"|\"version\": \"$VERSION\"|g" "$FILE"
          
          # Проверка результата в логах
          echo "Проверка манифеста:"
          grep '"version":' "$FILE"

          # 4. Git config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 5. Фиксация изменений
          git add "$FILE"
          
          if git diff --staged --quiet; then
            echo "Изменений нет."
          else
            git commit -m "chore: bump version to $VERSION"
            git push origin HEAD:main
            
            # Переставляем тег, чтобы архив релиза обновился
            git tag -f ${{ github.ref_name }}
            git push -f origin ${{ github.ref_name }}
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
